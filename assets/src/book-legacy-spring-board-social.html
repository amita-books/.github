<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;background:#0E0E0E;overflow:hidden}

.name{font-family:"Didot";font-size:38px;letter-spacing:12px;margin:34px 0 0 12px}

.divider{width:1px;height:380px;background:#6E5D36}
.right{flex:1;padding:0 70px 0 64px;color:#F3EDE0}
.kicker{font-family:"Didot";font-size:20px;letter-spacing:6px;color:#C9A961}
.title{font-family:"Nanum Myeongjo","NanumMyeongjo","AppleMyungjo",serif;font-weight:700;font-size:58px;line-height:1.25;margin:22px 0 0}
.title b{color:#C9A961;font-weight:700;font-family:"Bodoni 72",serif}
.stack{font-family:"Didot";font-size:24px;letter-spacing:1px;color:#E8DCC0;margin-top:28px}
.rule{width:120px;height:1px;background:#C9A961;margin:30px 0 24px}
.meta{font-family:"Nanum Gothic";font-size:22px;color:#BDB3A0;line-height:1.6}
</style></head><body><div class="frame"></div>
<div class="wrap">
 <div class="left"><div class="ring"><div class="mono">A</div></div><div class="name">AMITA</div><div class="sub">BOOKS</div></div>

  <div class="title">레거시 <b>Spring</b><br>게시판 학습서</div>

 </div>
